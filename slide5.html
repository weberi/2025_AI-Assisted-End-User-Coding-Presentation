<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Slide 2 – Motivation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
 <div class="layout">
 <div id="sidebar-container"></div>  

<div class="content">
      <h2>Ergebnisse</h2>

<!-- Komplettes Diagramm als HTML mit Chart.js -->
<div style="display: flex; flex-wrap: wrap; gap: 2em; justify-content: center; margin-bottom: 2em;">
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 260px;">
    <canvas id="chart-success" width="220" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">Erfolg</div>
  </div>
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 260px;">
    <canvas id="chart-effort" width="220" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">Aufwand</div>
  </div>
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 260px;">
    <canvas id="chart-recommend" width="220" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">Empfehlen?</div>
  </div>
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 260px;">
    <canvas id="chart-use" width="220" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">Anwenden?</div>
  </div>
</div>
<div style="text-align:center; font-size:0.95em; margin-bottom:1em;">
  <span style="display:inline-block; width:18px; height:14px; background:#b0c4d3; border:0px solid #888; margin-right:0.5em; vertical-align:middle;"></span> BA
  <span style="display:inline-block; width:18px; height:14px; background:#ffe5cf; border:0px solid #888; margin:0 0.5em 0 1.5em; vertical-align:middle;"></span> MA
</div>



  <h2 style="margin-top:2em;">Bearbeitungszeit & Zusammenhänge</h2>
<div style="display: flex; flex-wrap: wrap; gap: 2em; justify-content: center; margin-bottom: 2em;">
  <!-- Chart 1: Bearbeitungszeit BA/MA -->
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 260px;">
    <canvas id="chart-time-ba-ma" width="220" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">Bearbeitungszeit (BA/MA)</div>
  </div>
  <!-- Chart 2: Bearbeitungszeit vs. Erfolg -->
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 260px;">
    <canvas id="chart-time-success" width="220" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">Bearbeitungszeit vs. Erfolg</div>
  </div>
  <!-- Chart 3: Bearbeitungszeit vs. Komplexität -->
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 260px;">
    <canvas id="chart-time-complexity" width="220" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">Bearbeitungszeit vs. Komplexität</div>
  </div>
</div>
<div style="text-align:center; font-size:0.95em; margin-bottom:1em;">
  <span style="display:inline-block; width:18px; height:14px; background:#e6f2ff; border:1px solid #888; margin-right:0.5em; vertical-align:middle;"></span> BA / Erfolg / Einfach
  <span style="display:inline-block; width:18px; height:14px; background:#ffb980; border:1px solid #888; margin:0 0.5em 0 1.5em; vertical-align:middle;"></span> MA / Kein Erfolg / Komplex
</div>
    </div>
  </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
 <script> Chart.register(window.ChartDataLabels);</script>
<script>
  // Farben wie TikZ: BA = hellgrau, MA = dunkelgrau
  const colorBA = "#b0c4d3";    // Hellblau 
  const colorMA = "#ffe5cf";    // Heller Peach-Ton

  // Aufgabe gelöst
  new Chart(document.getElementById('chart-success'), {
    type: 'bar',
    data: {
      labels: ['Nein', 'Ja'],
      datasets: [
        { label: 'BA', data: [6, 6], backgroundColor: colorBA },
        { label: 'MA', data: [3, 18], backgroundColor: colorMA }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 30, ticks: { stepSize: 5 } }
      }
    }
  });

  // Wahrgenommener Aufwand
  new Chart(document.getElementById('chart-effort'), {
    type: 'bar',
    data: {
      labels: ['Einfach', 'Mittel', 'Schwierig'],
      datasets: [
        { label: 'BA', data: [1, 8, 3], backgroundColor: colorBA },
        { label: 'MA', data: [2, 16, 3], backgroundColor: colorMA }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 28, ticks: { stepSize: 4 } }
      }
    }
  });

  // Empfehlung
  new Chart(document.getElementById('chart-recommend'), {
    type: 'bar',
    data: {
      labels: ['Nein', 'Ja'],
      datasets: [
        { label: 'BA', data: [2, 10], backgroundColor: colorBA },
        { label: 'MA', data: [3, 18], backgroundColor: colorMA }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 30, ticks: { stepSize: 5 } }
      }
    }
  });

  // Nutzung
  new Chart(document.getElementById('chart-use'), {
    type: 'bar',
    data: {
      labels: ['Nein', 'Vielleicht', 'Ja'],
      datasets: [
        { label: 'BA', data: [2, 3, 7], backgroundColor: colorBA },
        { label: 'MA', data: [0, 12, 9], backgroundColor: colorMA }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 30, ticks: { stepSize: 5 } }
      }
    }
  });
 
  fetch("sidebar.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("sidebar-container").innerHTML = data;
    });


  // Farben
  const colorBA2 = "#e6f2ff";    // Hellblau wie Sidebar
  const colorMA2 = "#ffb980";    // Kräftiger Peach-Ton

  // 1. Bearbeitungszeit (BA/MA)
  new Chart(document.getElementById('chart-time-ba-ma'), {
    type: 'bar',
    data: {
      labels: ['<1', '2–3', '4–5', '>6'],
      datasets: [
        { label: 'BA', data: [1, 9, 1, 1], backgroundColor: colorBA2 },
        { label: 'MA', data: [0, 3, 9, 9], backgroundColor: colorMA2 }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 18, ticks: { stepSize: 3 } }
      }
    }
  });

  // 2. Bearbeitungszeit vs. Erfolg
  new Chart(document.getElementById('chart-time-success'), {
    type: 'bar',
    data: {
      labels: ['<1', '2–3', '4–5', '>6'],
      datasets: [
        { label: 'Erfolg', data: [0, 9, 8, 7], backgroundColor: colorBA2 },
        { label: 'Kein Erfolg', data: [1, 3, 2, 3], backgroundColor: colorMA2 }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 18, ticks: { stepSize: 3 } }
      }
    }
  });

  // 3. Bearbeitungszeit vs. Komplexität
  new Chart(document.getElementById('chart-time-complexity'), {
    type: 'bar',
    data: {
      labels: ['<1', '2–3', '4–5', '>6'],
      datasets: [
        { label: 'Einfach', data: [1, 8, 3, 4], backgroundColor: colorBA2 },
        { label: 'Komplex', data: [0, 4, 7, 6], backgroundColor: colorMA2 }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 14, ticks: { stepSize: 2 } }
      }
    }
  });
</script>
</html>
