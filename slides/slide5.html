<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ergebnisse</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
 <div class="layout">
 <div id="sidebar-container"></div>  

<div class="content">
      <h2>Ergebnisse</h3>

<!-- Komplettes Diagramm als HTML mit Chart.js -->
<div style="display: flex; flex-wrap: wrap; gap: 2em; justify-content: center; margin-bottom: 2em;">
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 260px;">
    <canvas id="chart-success" width="220" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">Erfolg</div>
  </div>
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 260px;">
    <canvas id="chart-effort" width="220" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">Aufwand</div>
  </div>
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 260px;">
    <canvas id="chart-recommend" width="220" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">Empfehlen?</div>
  </div>
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 260px;">
    <canvas id="chart-use" width="220" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">Anwenden?</div>
  </div>
</div>
<div style="text-align:center; font-size:0.95em; margin-bottom:1em;">
  <span style="display:inline-block; width:18px; height:14px; background:#b0c4d3; border:0px solid #888; margin-right:0.5em; vertical-align:middle;"></span> BA
  <span style="display:inline-block; width:18px; height:14px; background:#ffe5cf; border:0px solid #888; margin:0 0.5em 0 1.5em; vertical-align:middle;"></span> MA
</div>



  <h3>Bearbeitungszeit</h3>
<div style="display: flex; flex-wrap: wrap; gap: 2em; justify-content: center; margin-bottom: 2em;">
  <!-- Chart 1: Bearbeitungszeit BA/MA -->
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 260px;">
    <canvas id="chart-time-ba-ma" width="220" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">Bearbeitungszeit [h] (BA/MA)</div>
  </div>


    </div>

  <h3>Selbsteinschätzung Vorerfahrung</h3>
<div style="display: flex; flex-wrap: wrap; gap: 2em; justify-content: center; margin-bottom: 2em;">
  <!-- KI Nutzung -->
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 210px;">
    <canvas id="chart-ai-usage" width="180" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">KI Nutzung</div>
  </div>
  <!-- KI Kompetenz -->
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 210px;">
    <canvas id="chart-ai-competence" width="180" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">KI Kompetenz</div>
  </div>
  <!-- Programmieren -->
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 210px;">
    <canvas id="chart-Programmieren" width="180" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">Programmieren</div>
  </div>
  <!-- HTML -->
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 210px;">
    <canvas id="chart-html" width="180" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">HTML</div>
  </div>
  <!-- Web Entwicklung -->
  <div style="background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 1.5em; width: 210px;">
    <canvas id="chart-webdev" width="180" height="140"></canvas>
    <div style="font-weight: bold; text-align: center; margin-top: 0.5em;">Web Entwicklung</div>
  </div>
</div>
<div style="text-align:center; font-size:0.95em; margin-bottom:1em;">
  <span style="display:inline-block; width:18px; height:14px; background:#b0c4d3; border:1px solid #888; margin-right:0.5em; vertical-align:middle;"></span> BA
  <span style="display:inline-block; width:18px; height:14px; background:#ffe5cf; border:1px solid #888; margin:0 0.5em 0 1.5em; vertical-align:middle;"></span> MA
</div>



  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
 <script> Chart.register(window.ChartDataLabels);</script>
<script>
  // Farben wie TikZ: BA = hellgrau, MA = dunkelgrau
  const colorBA = "#b0c4d3";    // Hellblau 
  const colorMA = "#ffe5cf";    // Heller Peach-Ton

  // Aufgabe gelöst
  new Chart(document.getElementById('chart-success'), {
    type: 'bar',
    data: {
      labels: ['Nein', 'Ja'],
      datasets: [
        { label: 'BA', data: [6, 6], backgroundColor: colorBA },
        { label: 'MA', data: [3, 18], backgroundColor: colorMA }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 30, ticks: { stepSize: 5 } }
      }
    }
  });

  // Wahrgenommener Aufwand
  new Chart(document.getElementById('chart-effort'), {
    type: 'bar',
    data: {
      labels: ['Einfach', 'Mittel', 'Schwierig'],
      datasets: [
        { label: 'BA', data: [1, 8, 3], backgroundColor: colorBA },
        { label: 'MA', data: [2, 16, 3], backgroundColor: colorMA }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 28, ticks: { stepSize: 4 } }
      }
    }
  });

  // Empfehlung
  new Chart(document.getElementById('chart-recommend'), {
    type: 'bar',
    data: {
      labels: ['Nein', 'Ja'],
      datasets: [
        { label: 'BA', data: [2, 10], backgroundColor: colorBA },
        { label: 'MA', data: [3, 18], backgroundColor: colorMA }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 30, ticks: { stepSize: 5 } }
      }
    }
  });

  // Nutzung
  new Chart(document.getElementById('chart-use'), {
    type: 'bar',
    data: {
      labels: ['Nein', 'Vielleicht', 'Ja'],
      datasets: [
        { label: 'BA', data: [2, 3, 7], backgroundColor: colorBA },
        { label: 'MA', data: [0, 12, 9], backgroundColor: colorMA }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 30, ticks: { stepSize: 5 } }
      }
    }
  });
 
  fetch("sidebar.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("sidebar-container").innerHTML = data;
    });


  // Farben

  const colorBA2 = "#b0c4d3";    // Hellblau 
  const colorMA2 = "#ffe5cf";    // Heller Peach-Ton

  // 1. Bearbeitungszeit (BA/MA)
  new Chart(document.getElementById('chart-time-ba-ma'), {
    type: 'bar',
    data: {
      labels: ['<1', '2–3', '4–5', '>6'],
      datasets: [
        { label: 'BA', data: [1, 9, 1, 1], backgroundColor: colorBA2 },
        { label: 'MA', data: [0, 3, 9, 9], backgroundColor: colorMA2 }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 18, ticks: { stepSize: 3 } }
      }
    }
  });


  // Farben
  const colorBA3 = "#b0c4d3";    // Hellblau
  const colorMA3 = "#ffe5cf";    // Heller Peach-Ton

  // KI Nutzung
  new Chart(document.getElementById('chart-ai-usage'), {
    type: 'bar',
    data: {
      labels: ['Selten', 'Oft', 'Sehr oft'],
      datasets: [
        { label: 'BA', data: [3, 2, 7], backgroundColor: colorBA3 },
        { label: 'MA', data: [1, 11, 9], backgroundColor: colorMA3 }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 25, ticks: { stepSize: 5 } }
      }
    }
  });

  // KI Kompetenz
  new Chart(document.getElementById('chart-ai-competence'), {
    type: 'bar',
    data: {
      labels: ['Wenig', 'Mittel', 'Hoch'],
      datasets: [
        { label: 'BA', data: [5, 4, 3], backgroundColor: colorBA3 },
        { label: 'MA', data: [5, 14, 2], backgroundColor: colorMA3 }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 25, ticks: { stepSize: 5 } }
      }
    }
  });

  // Programmieren
  new Chart(document.getElementById('chart-Programmieren'), {
    type: 'bar',
    data: {
      labels: ['Kein', 'Etwas', 'Gut'],
      datasets: [
        { label: 'BA', data: [3, 7, 2], backgroundColor: colorBA3 },
        { label: 'MA', data: [6, 13, 2], backgroundColor: colorMA3 }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 25, ticks: { stepSize: 5 } }
      }
    }
  });

  // HTML
  new Chart(document.getElementById('chart-html'), {
    type: 'bar',
    data: {
      labels: ['Kein', 'Etwas', 'Gut'],
      datasets: [
        { label: 'BA', data: [8, 4, 0], backgroundColor: colorBA3 },
        { label: 'MA', data: [13, 8, 0], backgroundColor: colorMA3 }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 25, ticks: { stepSize: 5 } }
      }
    }
  });

  // Web Entwicklung
  new Chart(document.getElementById('chart-webdev'), {
    type: 'bar',
    data: {
      labels: ['Kein', 'Etwas', 'Gut'],
      datasets: [
        { label: 'BA', data: [10, 2, 0], backgroundColor: colorBA3 },
        { label: 'MA', data: [11, 10, 0], backgroundColor: colorMA3 }
      ]
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#222',
          anchor: 'center',
          align: 'center',
          font: { weight: 'bold', size: 14 }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, max: 25, ticks: { stepSize: 5 } }
      }
    }
  });
</script>
</body>
</html>
