<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212.7915403272284 710.0049235727296" width="1212.7915403272284" height="710.0049235727296"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Virgil; src: url(data:font/woff2;base64,); }</style></defs><g transform="translate(19.536813383809715 60.972260047181976) rotate(356.23931910129176 368.495849609375 157.5)"><text x="0" y="24.966" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">import pandas as pd</text><text x="0" y="56.466" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">import matplotlib.pyplot as plt</text><text x="0" y="87.96600000000001" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="119.46600000000001" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">data = {'Jahr': [2021, 2022, 2023],</text><text x="0" y="150.966" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">        'Teilnehmer': [120, 145, 180]}</text><text x="0" y="182.466" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="213.966" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">df = pd.DataFrame(data)</text><text x="0" y="245.466" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">df.plot(x='Jahr', y='Teilnehmer', kind='bar')</text><text x="0" y="276.966" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">plt.title("Teilnehmerzahlen")</text><text x="0" y="308.466" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">plt.show()</text></g><g transform="translate(718.5409637744347 38.472260047181976) rotate(7.843424298002934 214.03793334960938 78.75)"><text x="0" y="24.966" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">SELECT jahr, teilnehmer</text><text x="0" y="56.466" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">FROM veranstaltung</text><text x="0" y="87.96600000000001" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">WHERE jahr &gt;= 2025</text><text x="0" y="119.46600000000001" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ORDER BY jahr ASC;</text><text x="0" y="150.966" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text></g><g transform="translate(440.54163816337643 457.09134232256145) rotate(13.425809249714684 377.13592529296875 78.75)"><text x="0" y="24.966" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">SELECT jahr, COUNT(*) AS teilnehmerzahl</text><text x="0" y="56.466" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">FROM anmeldung</text><text x="0" y="87.96600000000001" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">GROUP BY jahr</text><text x="0" y="119.46600000000001" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ORDER BY jahr;</text><text x="0" y="150.966" font-family="Virgil, Segoe UI Emoji" font-size="36px" fill="#cccccc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text></g></svg>