<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Terminabstimmung</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 2em auto;
      padding: 1em;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    label {
      display: block;
      margin: 1em 0 0.5em;
    }
    button {
      margin-top: 1em;
      padding: 0.5em 1em;
    }
  </style>
</head>
<body>
  <h2>Terminabstimmung</h2>
  <form id="terminForm">
    <label>Name:
      <input type="text" name="name" required>
    </label>

    <label>E-Mail:
      <input type="email" name="email" required>
    </label>

    <label>Wähle einen Termin:
      <select name="slot" required>
        <option value="">-- bitte wählen --</option>
        <option value="Montag, 10 Uhr">Montag, 10 Uhr</option>
        <option value="Dienstag, 14 Uhr">Dienstag, 14 Uhr</option>
        <option value="Donnerstag, 16 Uhr">Donnerstag, 16 Uhr</option>
      </select>
    </label>

    <button type="submit">Abschicken</button>
    <p id="status"></p>
  </form>

  <script>
    document.getElementById("terminForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);

      fetch("DEINE_WEBAPP_URL", {
        method: "POST",
        body: data
      })
      .then(response => response.text())
      .then(text => {
        document.getElementById("status").textContent = "Danke! Ihre Auswahl wurde gespeichert.";
        form.reset();
      })
      .catch(err => {
        document.getElementById("status").textContent = "Fehler beim Absenden. Bitte erneut versuchen.";
      });
    });
  </script>
</body>
</html>
